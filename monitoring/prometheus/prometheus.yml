global:
  scrape_interval: 2s # Fast scrape for load testing visibility
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'kasir-api'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
