#:schema https://json.schemastore.org/any.json
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/app.exe ./cmd/server"
bin = "tmp/app.exe"

# hanya file Go
include_ext = ["go"]

# hanya folder backend
include_dir = [
  "cmd",
  "internal"
]

# EXCLUDE YANG WAJIB
exclude_dir = [
  "tmp",
  "vendor",
  "testdata",
  "web",
  "public",
  "node_modules",
  ".git"
]

exclude_regex = ["_test.go"]

delay = 200
stop_on_error = true

[log]
time = true

[color]
main = "magenta"
build = "yellow"
runner = "green"
